name: arena-fetch-assets
on:
  push:
    paths:
      - '.arena-fetch/**'
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Download source assets
        run: python3 .arena-fetch/fetch.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Render page with browser
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
          python .arena-fetch/render.py
      - name: Commit
        run: |
          git config user.name "arena-asset-bot"
          git config user.email "arena-asset-bot@users.noreply.github.com"
          git add -f .arena-fetch/raw .arena-fetch/rendered
          git commit -m "chore: fetch source assets" || echo "nothing to commit"
          git push origin HEAD:${GITHUB_REF_NAME}
